# Publishes the landing page in docs/ to GitHub Pages, with the latest
# release's installers copied in next to it (docs/download/), so a download
# comes straight from the site instead of sending people to GitHub.
#
# Runs when the page changes, when a release finishes building, and by hand.
# The installers are copied in at publish time only, never committed.
name: Website

on:
  push:
    branches: [main]
    paths: ["docs/**", ".github/workflows/pages.yml"]
  # A release is created by the Release workflow's own token, which can't
  # start other workflows directly; finishing a run can.
  workflow_run:
    workflows: ["Release"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One publish at a time, and never cut one off halfway.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7

      # release.json tells the page the version, file names and sizes. If
      # there's no release yet, the page falls back to linking GitHub.
      - name: Copy in the latest installers
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p docs/download
          if gh release view --repo "$GITHUB_REPOSITORY" --json tagName,assets > docs/download/release.json; then
            gh release download --repo "$GITHUB_REPOSITORY" --dir docs/download \
              --pattern '*.exe' --pattern '*.msi' --pattern '*.dmg' \
              --pattern '*.AppImage' --pattern '*.deb' --pattern '*.rpm'
          else
            rm -f docs/download/release.json
          fi
          ls -la docs/download

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs

      - id: deployment
        uses: actions/deploy-pages@v4
